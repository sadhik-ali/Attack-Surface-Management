# Alembic configuration for the ASM backend.
#
# There is deliberately NO database URL in this file. alembic/env.py injects
# `sqlalchemy.url` from app.core.config.settings.database_url (env var
# ASM_DATABASE_URL), so migrations always hit exactly the database the running
# application uses, and credentials never end up in a checked-in file.

[alembic]
# %(here)s keeps the script directory valid no matter which cwd a command runs from.
script_location = %(here)s/alembic
prepend_sys_path = .
# Revision files are named <rev>_<slug>.py using Alembic's standard 12-character
# revision id. Ordering comes from the revision graph, not from the filename.
file_template = %%(rev)s_%%(slug)s
# version_locations left at the default <script_location>/versions.

# Version ordering is expressed by the revision graph, not by timestamps, so the
# default localtime stamp is left alone here (`tzdata` is not installed on the
# Windows dev box and ZoneInfo('utc') then raises).
# timezone =

# Offline SQL generation (`alembic upgrade head --sql`) emits one file per step.
output_encoding = utf-8

sqlalchemy.url =


[post_write_hooks]
# Hooks are disabled: the generated file is reviewed by hand before committing,
# and running a formatter here would rewrite unrelated code in the file.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
